<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-label="ts-type-cleaner logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171E3A"/>
      <stop offset="1" stop-color="#0A0F20"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="78" x2="192" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="126" r="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#818CF8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="256" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect x="1" y="1" width="254" height="254" rx="57" stroke="url(#rim)" stroke-width="2"/>
  <path d="M58 1 H198 A57 57 0 0 1 255 58 V120 C212 96 44 96 1 120 V58 A57 57 0 0 1 58 1 Z" fill="url(#sheen)"/>
  <circle cx="128" cy="126" r="112" fill="url(#glow)"/>

  <!-- T 字投影 -->
  <g stroke="#05070F" stroke-opacity="0.5" stroke-width="24" stroke-linecap="round" transform="translate(0,6)">
    <path d="M84 88 H172"/>
    <path d="M128 100 V168"/>
  </g>
  <!-- T 字主体 -->
  <g stroke="url(#accent)" stroke-width="22" stroke-linecap="round">
    <path d="M84 84 H172"/>
    <path d="M128 96 V164"/>
  </g>
  <!-- 清理碎屑 -->
  <circle cx="168" cy="176" r="6" fill="url(#accent)" opacity="0.9"/>
  <circle cx="186" cy="188" r="4.5" fill="url(#accent)" opacity="0.6"/>
  <circle cx="200" cy="170" r="3.5" fill="url(#accent)" opacity="0.35"/>
</svg>
